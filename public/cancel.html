<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Puffn – Payment Canceled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: #f9fafb;
    }
    .card {
      background: #020617;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      padding: 2rem 2.4rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.7rem;
      color: #f97373;
    }
    p {
      margin-top: 0.25rem;
      margin-bottom: 0.75rem;
      color: #9ca3af;
      font-size: 0.95rem;
    }
    a {
      color: #a855f7;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .icon {
      font-size: 2.4rem;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Payment canceled</h1>
    <p>Your payment was not completed. No key has been sent.</p>
    <p>You can safely close this page or try again.</p>
    <p><a href="/">← Back to Puffn Keys</a></p>
  </div>
</body>
</html>
