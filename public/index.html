<script>
  // Set current year
  document.getElementById("year").textContent = new Date().getFullYear();

  function scrollToSection(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // Your publishable Stripe key (optional)
  const stripe = Stripe("pk_test_YOUR_PUBLISHABLE_KEY_HERE");

  const emailInput = document.getElementById("email");
  const errorBox = document.getElementById("error-message");
  const checkoutButton = document.getElementById("checkout-button");
  const heroBuy = document.getElementById("hero-buy");

  heroBuy.addEventListener("click", () => {
    scrollToSection("top");
    emailInput.focus();
  });

  function validateEmail(value) {
    return /\S+@\S+\.\S+/.test(value);
  }

  async function startCheckout() {
    const email = emailInput.value.trim();
    errorBox.style.display = "none";

    if (!email) {
      errorBox.textContent = "Please enter the email where your key will be delivered.";
      errorBox.style.display = "block";
      return;
    }
    if (!validateEmail(email)) {
      errorBox.textContent = "Invalid email format.";
      errorBox.style.display = "block";
      return;
    }

    checkoutButton.disabled = true;
    checkoutButton.innerHTML = "<span>Redirecting…</span>";

    try {
      // ⭐ FIXED — Calls your Render backend correctly
      const res = await fetch("https://puffn-backend-11jo.onrender.com/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });

      const data = await res.json();
      console.log("Stripe Response:", data);

      if (!data.url) {
        errorBox.textContent = "Could not create a payment session.";
        errorBox.style.display = "block";
        checkoutButton.disabled = false;
        checkoutButton.innerHTML = "<span>Buy Key</span>";
        return;
      }

      // ⭐ FIXED — Redirect using Stripe session URL from backend
      window.location.href = data.url;

    } catch (err) {
      console.error(err);
      errorBox.textContent = "Error contacting payment server.";
      errorBox.style.display = "block";
      checkoutButton.disabled = false;
      checkoutButton.innerHTML = "<span>Buy Key</span>";
    }
  }

  checkoutButton.addEventListener("click", startCheckout);
</script>
